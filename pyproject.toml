[tool.poetry]
name = "amanuensis-root-verification"
version = "0.0.0"
description = "Root Poetry project to run sidecar pytest verification commands"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.115"
uvicorn = "^0.32"
python-multipart = "^0.0.12"
pydantic = "^2"
httpx = "^0.27"
pytest = "^8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
